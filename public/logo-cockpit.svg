<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Cockpit">
  <!--
    The Cockpit beacon, drawn to the Brand spec's stated construction
    (docs/design/Cockpit Brand.dc.html) — not to the original artwork, which
    the spec explicitly rebuilds: "the original's radii and gap were close to
    these but not on any system, which is why it resisted clean scaling."

    Construction, 48-unit grid, every value stated:
      ring centre (24, 21) — three units above canvas centre
      radii: outer 16, inner arc 9, dot 4 (ratio 4 : 2.25 : 1)
      ring gap 44° centred on vertical; endpoints (29.99, 35.84) (18.01, 35.84)
      inner arc exactly 180°, (15, 21) to (33, 21) over the top
      stem x 24, y 28 → 41
      stroke 2.5, round caps, one weight everywhere

    Two flat colours is the whole system: slate #3A5060 for structure,
    gold #E5C264 for the dot and only the dot. No gradient — the spec's
    "one thing to drop". This file is the ≥40px full form; smaller sizes use
    the ramp forms of the exported favicons, which shed parts rather than scale.
  -->

  <!-- Outer ring, the long way around the 44° bottom gap -->
  <path d="M 29.99 35.84 A 16 16 0 1 0 18.01 35.84"
        stroke="#3A5060" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Inner arc: a half-circle, not an eyeballed sweep -->
  <path d="M 15 21 A 9 9 0 0 1 33 21"
        stroke="#3A5060" stroke-width="2.5" stroke-linecap="round"/>

  <!-- The dot: the only colour element, identical in both themes -->
  <circle cx="24" cy="21" r="4" fill="#E5C264"/>

  <!-- Stem: clears the dot by 3, passes 5.16 below the ring endpoints -->
  <path d="M 24 28 L 24 41"
        stroke="#3A5060" stroke-width="2.5" stroke-linecap="round"/>
</svg>
